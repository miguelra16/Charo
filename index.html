        const TOTAL_Q = 50;
        const MIN_PASS = 26; // Más de 25
        
        let testSet = [];
        let currIdx = 0;
        let cCount = 0;
        let wCount = 0;
        let ansLock = false;

        function shuffle(arr) {
            let copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function startExam() {
            testSet = shuffle(DB).slice(0, TOTAL_Q);
            currIdx = 0; cCount = 0; wCount = 0;
            
            updateScores();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.replace('flex', 'hidden');
            document.getElementById('exam-screen').classList.replace('hidden', 'flex');
            
            loadQuestion();
        }

        function loadQuestion() {
            ansLock = false;
            const q = testSet[currIdx];
            
            document.getElementById('q-counter').innerText = `${currIdx + 1} / ${TOTAL_Q}`;
            document.getElementById('q-text').innerText = q[0];
            
            const btnBox = document.getElementById('options-box');
            btnBox.innerHTML = '';
            
            const nBtn = document.getElementById('next-btn');
            nBtn.disabled = true;
            nBtn.className = "w-full bg-gray-200 text-gray-400 font-bold py-4 px-6 rounded-2xl text-lg transition duration-200";

            q[1].forEach((optText, i) => {
                const b = document.createElement('button');
                b.className = 'w-full text-left p-4 rounded-xl bg-white font-semibold text-gray-700 hover:border-blue-400 hover:bg-blue-50 option-btn flex justify-between items-center shadow-sm';
                b.innerHTML = `<span>${optText}</span><div class="chk w-6 h-6 rounded-full border-2 border-gray-300 flex shrink-0 items-center justify-center"></div>`;
                b.onclick = () => selectOpt(i, b);
                btnBox.appendChild(b);
            });
        }

        function selectOpt(sIdx, clkBtn) {
            if (ansLock) return;
            ansLock = true;

            const trueAns = testSet[currIdx][2];
            const isCorrect = (sIdx === trueAns);
            const allBtn = document.getElementById('options-box').querySelectorAll('button');

            allBtn.forEach((b, i) => {
                b.classList.add('disabled');
                b.classList.remove('hover:border-blue-400', 'hover:bg-blue-50');
                let chk = b.querySelector('.chk');
                
                if (i === trueAns) {
                    b.classList.add('correct-ans');
                    chk.classList.replace('border-gray-300', 'border-transparent');
                    chk.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>';
                } else if (i === sIdx && !isCorrect) {
                    b.classList.add('wrong-ans');
                    chk.classList.replace('border-gray-300', 'border-transparent');
                    chk.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>';
                }
            });

            isCorrect ? cCount++ : wCount++;
            updateScores();

            const nBtn = document.getElementById('next-btn');
            nBtn.disabled = false;
            nBtn.className = "w-full bg-blue-600 text-white font-bold py-4 px-6 rounded-2xl text-lg hover:bg-blue-700 shadow-md transition duration-200 transform hover:-translate-y-0.5 active:translate-y-0";
            nBtn.innerText = (currIdx === TOTAL_Q - 1) ? 'Ver Resultados' : 'Siguiente Pregunta';
        }

        function nextQ() {
            if (currIdx < TOTAL_Q - 1) {
                currIdx++;
                loadQuestion();
                document.getElementById('exam-screen').querySelector('main').scrollTop = 0;
            } else showRes();
        }

        function updateScores() {
            document.getElementById('score-c').innerText = cCount;
            document.getElementById('score-w').innerText = wCount;
        }

        function showRes() {
            document.getElementById('exam-screen').classList.replace('flex', 'hidden');
            document.getElementById('result-screen').classList.replace('hidden', 'flex');

            const isApto = cCount >= MIN_PASS;
            const t = document.getElementById('res-title');
            
            document.getElementById('res-c').innerText = cCount;
            document.getElementById('res-w').innerText = wCount;

            if (isApto) {
                t.innerText = 'APTO'; t.className = 'text-5xl font-black mb-1 tracking-tight text-green-500';
                document.getElementById('res-msg').innerText = `¡Enhorabuena! Has superado la prueba (Mínimo: ${MIN_PASS})`;
                document.getElementById('res-icon').innerHTML = '<div class="bg-green-100 rounded-full p-5 mb-2"><svg class="w-16 h-16 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>';
            } else {
                t.innerText = 'NO APTO'; t.className = 'text-5xl font-black mb-1 tracking-tight text-red-500';
                document.getElementById('res-msg').innerText = `Necesitas ${MIN_PASS} aciertos para aprobar. ¡Sigue repasando!`;
                document.getElementById('res-icon').innerHTML = '<div class="bg-red-100 rounded-full p-5 mb-2"><svg class="w-16 h-16 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>';
            }
        }
    </script>
</body>
</html>
